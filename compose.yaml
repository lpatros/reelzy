services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: reelzy
      POSTGRES_USER: reelzy
      POSTGRES_PASSWORD: reelzy_local
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "reelzy", "-d", "reelzy"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: ${COMPOSE_PROJECT_NAME}-api:local
    build:
      context: ./reelzy-api
      dockerfile: ../infra/docker/api.Dockerfile
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgresql://reelzy:reelzy_local@db:5432/reelzy
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${COMPOSE_PROJECT_NAME}-api:local
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exitCode = 1; })
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./reelzy-app
      dockerfile: ../infra/docker/web.Dockerfile
      additional_contexts:
        compose: ./infra/docker
    ports:
      - "127.0.0.1:${REELZY_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
